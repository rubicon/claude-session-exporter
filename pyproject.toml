[project]
name = "claude-session-exporter"
version = "0.1.0"
description = "Export Claude Code and cowork sessions to Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dax Davis" }]
dependencies = ["typer>=0.12", "tomli-w>=1.0"]

[project.scripts]
claude-session-exporter = "claude_session_exporter.cli:app"
cse = "claude_session_exporter.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_session_exporter"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Selected explicitly so the lint surface does not shift when ruff's built-in
# defaults change. Ruff 0.16 widened those defaults and turned main red without
# a single line of this project changing.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads its CLI metadata from these call results in parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
